<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="mysteryBg" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#2D1B4E"/>
      <stop offset="100%" style="stop-color:#0D0D1A"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#D4AF37"/>
      <stop offset="50%" style="stop-color:#D4AF37;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#D4AF37;stop-opacity:0"/>
    </radialGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>
  <!-- Dark background -->
  <rect width="200" height="200" fill="url(#mysteryBg)"/>
  <!-- Mystical fog particles -->
  <circle cx="50" cy="180" r="30" fill="#8B008B" opacity="0.2" filter="url(#blur)"/>
  <circle cx="150" cy="170" r="40" fill="#4B0082" opacity="0.2" filter="url(#blur)"/>
  <circle cx="100" cy="160" r="35" fill="#1E90FF" opacity="0.15" filter="url(#blur)"/>
  <!-- Golden glow aura -->
  <ellipse cx="100" cy="100" rx="70" ry="70" fill="url(#glow)" filter="url(#blur)"/>
  <!-- Mystical Makara form -->
  <path d="M60 120 C40 100 50 70 80 60 C100 55 120 60 140 75 C160 90 165 120 150 140 C135 155 110 155 85 145 C70 140 55 135 60 120"
        fill="none" stroke="#D4AF37" stroke-width="2" opacity="0.8"/>
  <!-- Ethereal eyes -->
  <ellipse cx="80" cy="95" rx="10" ry="12" fill="#D4AF37" opacity="0.9"/>
  <ellipse cx="120" cy="95" rx="10" ry="12" fill="#D4AF37" opacity="0.9"/>
  <circle cx="80" cy="95" r="4" fill="white"/>
  <circle cx="120" cy="95" r="4" fill="white"/>
  <!-- Third eye -->
  <ellipse cx="100" cy="70" rx="6" ry="8" fill="#D4AF37"/>
  <circle cx="100" cy="70" r="3" fill="#8B008B"/>
  <!-- Floating runes -->
  <text x="25" y="50" fill="#D4AF37" opacity="0.6" font-size="14">ॐ</text>
  <text x="165" y="60" fill="#D4AF37" opacity="0.5" font-size="12">☸</text>
  <text x="30" y="160" fill="#D4AF37" opacity="0.4" font-size="10">✦</text>
  <text x="160" y="150" fill="#D4AF37" opacity="0.5" font-size="14">✧</text>
  <!-- Star particles -->
  <circle cx="45" cy="35" r="1.5" fill="#D4AF37"/>
  <circle cx="155" cy="40" r="1" fill="#D4AF37"/>
  <circle cx="175" cy="90" r="1.5" fill="#D4AF37"/>
  <circle cx="25" cy="100" r="1" fill="#D4AF37"/>
</svg>
